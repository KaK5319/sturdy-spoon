workflows:
  android-workflow:
    name: Android APK

    environment:
      flutter: stable

    scripts:
      - name: Create Android project
        script: |
          set -e
          echo "=== Creating Android project ==="
          flutter create --platforms=android .
          echo "=== Checking Android directory ==="
          test -d android
          ls -la android

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Apply app name and custom icon
        script: |
          set -e
          python3 - <<'PYEOF'
          import base64, hashlib, io, os, re, zipfile
          res = "android/app/src/main/res"
          # Remember the default icon hash so the verify step can prove it is gone
          default_icon = os.path.join(res, "mipmap-xxxhdpi/ic_launcher.png")
          if os.path.exists(default_icon):
              h = hashlib.sha256(open(default_icon, "rb").read()).hexdigest()
              open(".default_icon_sha", "w").write(h)
              print("default xxxhdpi icon sha256:", h[:16])
          # --- app label ---
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          s2 = re.sub(r'android:label="[^"]*"', 'android:label="漫画棚"', s, count=1)
          assert s2 != s, "android:label not found in AndroidManifest.xml"
          assert 'android:label="漫画棚"' in s2
          open(p, "w", encoding="utf-8").write(s2)
          print("manifest label now:", re.search(r'android:label="[^"]*"', s2).group(0))
          # --- custom icon ---
          data = base64.b64decode(open("icon/icons.b64", "rb").read())
          zf = zipfile.ZipFile(io.BytesIO(data))
          zf.extractall(res)
          for f in ("ic_launcher.xml", "ic_launcher_round.xml"):
              fp = os.path.join(res, "mipmap-anydpi-v26", f)
              if os.path.exists(fp):
                  os.remove(fp)
          want = zf.read("mipmap-xxxhdpi/ic_launcher.png")
          got = open(default_icon, "rb").read()
          assert got == want, "ic_launcher.png on disk does not match icons.b64"
          print("icon applied, xxxhdpi sha256:", hashlib.sha256(got).hexdigest()[:16], len(got), "bytes")
          PYEOF

      - name: Build APK
        script: |
          flutter build apk --debug

      - name: Verify APK contains new name and icon
        script: |
          set -e
          python3 - <<'PYEOF'
          import base64, glob, hashlib, io, struct, zipfile, zlib

          def png_rgba(data):
              assert data[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
              pos = 8; idat = b""; w = h = ct = bd = None; plte = None
              while pos < len(data):
                  ln = struct.unpack(">I", data[pos:pos+4])[0]
                  typ = data[pos+4:pos+8]; chunk = data[pos+8:pos+8+ln]; pos += 12 + ln
                  if typ == b"IHDR":
                      w, h, bd, ct = struct.unpack(">IIBB", chunk[:10])
                  elif typ == b"PLTE":
                      plte = chunk
                  elif typ == b"IDAT":
                      idat += chunk
                  elif typ == b"IEND":
                      break
              assert bd == 8, "only 8-bit PNG supported"
              ch = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}[ct]
              stride = w * ch
              raw = zlib.decompress(idat)
              out = bytearray(); prev = bytearray(stride); i = 0
              for _y in range(h):
                  f = raw[i]; i += 1
                  line = bytearray(raw[i:i+stride]); i += stride
                  if f == 1:
                      for x in range(ch, stride):
                          line[x] = (line[x] + line[x-ch]) & 0xff
                  elif f == 2:
                      for x in range(stride):
                          line[x] = (line[x] + prev[x]) & 0xff
                  elif f == 3:
                      for x in range(stride):
                          a = line[x-ch] if x >= ch else 0
                          line[x] = (line[x] + ((a + prev[x]) >> 1)) & 0xff
                  elif f == 4:
                      for x in range(stride):
                          a = line[x-ch] if x >= ch else 0
                          b = prev[x]
                          c = prev[x-ch] if x >= ch else 0
                          pp = a + b - c
                          pa, pb, pc = abs(pp-a), abs(pp-b), abs(pp-c)
                          pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                          line[x] = (line[x] + pr) & 0xff
                  out += line; prev = line
              if ct == 6:
                  return bytes(out)
              rgba = bytearray()
              if ct == 2:
                  for i in range(0, len(out), 3):
                      rgba += out[i:i+3]; rgba.append(255)
              elif ct == 3:
                  for idx in out:
                      rgba += plte[idx*3:idx*3+3]; rgba.append(255)
              elif ct == 0:
                  for g in out:
                      rgba += bytes((g, g, g, 255))
              elif ct == 4:
                  for i in range(0, len(out), 2):
                      g, a = out[i], out[i+1]
                      rgba += bytes((g, g, g, a))
              return bytes(rgba)

          apks = glob.glob("build/app/outputs/flutter-apk/*.apk")
          assert apks, "no APK found under build/app/outputs/flutter-apk/"
          apk = zipfile.ZipFile(apks[0])
          print("verifying:", apks[0])
          # 1) app label inside the binary AndroidManifest.xml
          manifest = apk.read("AndroidManifest.xml")
          name = "漫画棚"
          assert name.encode("utf-16-le") in manifest or name.encode("utf-8") in manifest, \
              "FAIL: APK manifest does not contain 漫画棚 (label step did not reach the APK)"
          print("label check OK: 漫画棚 found in APK manifest")
          # 2) launcher icon inside the APK
          want = zipfile.ZipFile(io.BytesIO(base64.b64decode(
              open("icon/icons.b64", "rb").read()))).read("mipmap-xxxhdpi/ic_launcher.png")
          cands = [n for n in apk.namelist() if n.endswith("ic_launcher.png") and "xxxhdpi" in n]
          assert cands, "FAIL: no xxxhdpi ic_launcher.png in APK"
          got = apk.read(cands[0])
          print("APK icon entry:", cands[0], len(got), "bytes")
          if hashlib.sha256(got).hexdigest() == hashlib.sha256(want).hexdigest():
              print("icon check OK: bytes identical to icons.b64")
          else:
              assert png_rgba(got) == png_rgba(want), \
                  "FAIL: APK ic_launcher.png pixels differ from icons.b64 (default icon packaged?)"
              print("icon check OK: pixels identical to icons.b64 (recompressed by aapt2)")
          print("VERIFY PASSED: APK contains 漫画棚 label and the custom icon")
          PYEOF

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
